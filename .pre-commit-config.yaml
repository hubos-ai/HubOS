repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-ast
        exclude: '(?x)(.*/skills/.*|^scripts/pack/)'
      - id: sort-simple-yaml
        exclude: '(?x)(.*/skills/.*|^scripts/pack/)'
      - id: check-yaml
        exclude: |
          (?x)^(
              meta.yaml
          )$
      - id: check-xml
        exclude: '(?x)(.*/skills/.*|^scripts/pack/)'
      - id: check-toml
      - id: check-docstring-first
        exclude: '(?x)(.*/skills/.*|^scripts/pack/)'
      - id: check-json
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|locales/.*\.json)'
      - id: fix-encoding-pragma
        exclude: '(?x)(.*/skills/.*|^scripts/pack/)'
      - id: detect-private-key
      - id: trailing-whitespace
        exclude: '(?x)(.*/skills/.*|^scripts/pack/)'
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v3.1.0
    hooks:
      - id: add-trailing-comma
        exclude: '(?x)(.*/skills/.*|^scripts/pack/)'
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.0
    hooks:
      - id: mypy
        exclude:
          (?x)(
          pb2\.py$
          | grpc\.py$
          | ^docs
          | ^experiments
          | ^scripts
          | \.html$
          | .*/skills/.*
          )
        args: [
          --ignore-missing-imports,
          --disable-error-code=var-annotated,
          --disable-error-code=union-attr,
          --disable-error-code=assignment,
          --disable-error-code=attr-defined,
          --disable-error-code=import-untyped,
          --disable-error-code=truthy-function,
          --disable-error-code=misc,
          --disable-error-code=call-overload,
          --disable-error-code=valid-type,
          --disable-error-code=arg-type,
          --disable-error-code=operator,
          --disable-error-code=dict-item,
          --follow-imports=skip,
          --explicit-package-bases,
        ]
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        args: [ --line-length=79 ]
        exclude: '(?x)(.*/skills/.*|^scripts/pack/)'
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: [ "--extend-ignore=E203"]
        exclude: '(?x)(.*/skills/.*|^scripts/pack/)'
  - repo: https://github.com/pylint-dev/pylint
    rev: v3.0.2
    hooks:
      - id: pylint
        exclude:
          (?x)(
          ^docs
          | ^experiments
          | ^scripts
          | pb2\.py$
          | grpc\.py$
          | \.demo$
          | \.md$
          | \.html$
          | .*/skills/.*
          )
        args: [
          --disable=W0511,
          --disable=W0718,
          --disable=W0122,
          --disable=C0103,
          --disable=R0913,
          --disable=E0401,
          --disable=E1101,
          --disable=C0415,
          --disable=W0603,
          --disable=R1705,
          --disable=R0914,
          --disable=E0601,
          --disable=W0602,
          --disable=W0604,
          --disable=R0801,
          --disable=R0902,
          --disable=R0903,
          --disable=C0123,
          --disable=W0231,
          --disable=W1113,
          --disable=W0221,
          --disable=R0401,
          --disable=W0632,
          --disable=W0123,
          --disable=C3001,
          --disable=W0201,
          --disable=C0302,
          --disable=W1203,
          --disable=C2801,
          --disable=C0114,  # Disable missing module docstring for quick dev
          --disable=C0115,  # Disable missing class docstring for quick dev
          --disable=C0116,  # Disable missing function or method docstring for quick dev
          --disable=C0413,  # wrong-import-position (Codex lazy imports)
          --disable=C0301,  # line-too-long
          --disable=R0911,  # too-many-return-statements
          --disable=R0912,  # too-many-branches
          --disable=R1702,  # too-many-nested-blocks
          --disable=W0212,  # protected-access
          --disable=W0404,  # reimported
          --disable=W0706,  # try-except-raise
          --disable=W0612,  # unused-variable
          --disable=W0613,  # unused-argument
          --disable=W0614,  # unused-wildcard-import
          --disable=W0621,  # redefined-outer-name (pytest fixtures)
          --disable=C0411,  # wrong-import-order
          --disable=C0412,  # ungrouped-imports
          --disable=W0611,  # unused-import
          --disable=W0130,  # duplicate-value
          --disable=W1514,  # unspecified-encoding
          --disable=W1510,  # subprocess-run-check
          --disable=W1309,  # f-string-without-interpolation
          --disable=R0915,  # too-many-statements
          --disable=W0707,  # raise-missing-from
          --disable=E1130,  # invalid-unary-operand-type
          --disable=E0611,  # no-name-in-module
          --disable=W0719,  # broad-exception-raised
          --disable=W0108,  # unnecessary-lambda
          --disable=W0107,  # unnecessary-pass
          --disable=R1720,  # no-else-raise
          --disable=R1724,  # no-else-continue
          --disable=R1714,  # consider-using-in
          --disable=R0904,  # too-many-public-methods
          --disable=C0201,  # consider-iterating-dictionary
          --disable=E0402,  # relative-beyond-top-level
          --disable=W2301,  # unnecessary-ellipsis (Protocol classes use ...)
          --disable=E3701,  # invalid-field-call
          --disable=C0206,  # consider-using-dict-items
          --disable=R1732,  # consider-using-with
          --disable=C1803,  # use-implicit-booleaness-not-comparison
        ]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: 'v3.0.0'
    hooks:
      - id: prettier
        additional_dependencies: [ 'prettier@3.0.0' ]
        files: \.(tsx?)$
        exclude: '(?x)(^web/|^console/|/dist/|.*/skills/.*|^scripts/pack/)'
